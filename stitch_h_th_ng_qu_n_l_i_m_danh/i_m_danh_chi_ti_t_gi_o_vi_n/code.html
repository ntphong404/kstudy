<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;

            direction: ltr;
        }
        .status-chip-active-present { background-color: #2e7d32 !important; color: white !important; }
        .status-chip-active-absent { background-color: #d32f2f !important; color: white !important; }

    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background text-on-background font-body-main antialiased pb-32">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-on-surface w-full top-0 sticky z-40 border-b border-outline-variant dark:border-on-surface-variant flex items-center justify-between px-container-margin-mobile md:px-container-margin-desktop h-16 transition-colors">
<div class="flex items-center gap-4">
<button class="active:scale-95 duration-100 hover:bg-surface-container-high dark:hover:bg-on-secondary-fixed-variant transition-colors p-2 rounded-full">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Điểm danh Lớp 12A1</h1>
</div>
<div class="flex items-center">
<button class="active:scale-95 duration-100 hover:bg-surface-container-high dark:hover:bg-on-secondary-fixed-variant transition-colors p-2 rounded-full">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">notifications</span>
</button>
</div>
</header>
<main class="max-w-3xl mx-auto px-container-margin-mobile pt-stack-lg">
<!-- Summary Dashboard (Bento-ish) -->
<section class="grid grid-cols-3 gap-3 mb-stack-lg">
<div class="bg-surface-container-lowest border border-outline-variant p-4 rounded-xl flex flex-col items-center justify-center">
<span class="font-label-uppercase text-label-uppercase text-on-surface-variant mb-1">Sĩ số</span>
<span class="font-display-lg-mobile text-display-lg-mobile text-primary">42</span>
</div>
<div class="bg-surface-container-lowest border border-outline-variant p-4 rounded-xl flex flex-col items-center justify-center">
<span class="font-label-uppercase text-label-uppercase text-on-surface-variant mb-1">Hiện diện</span>
<span class="font-display-lg-mobile text-display-lg-mobile text-green-700" id="present-count">0</span>
</div>
<div class="bg-surface-container-lowest border border-outline-variant p-4 rounded-xl flex flex-col items-center justify-center">
<span class="font-label-uppercase text-label-uppercase text-on-surface-variant mb-1">Vắng mặt</span>
<span class="font-display-lg-mobile text-display-lg-mobile text-error" id="absent-count">0</span>
</div>
</section>
<!-- Search Bar -->
<div class="relative mb-stack-md group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary">search</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-full focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-body-main" placeholder="Tìm kiếm học sinh..." type="text"/>
</div>
<!-- Student List Container -->
<div class="flex flex-col gap-3">
<!-- Student Row (Repeatable Template) -->
<script>
                const students = [
                    { id: "HS001", name: "Nguyễn Thành Chung", avatar: "image-1" },
                    { id: "HS002", name: "Lê Thị Lan Anh", avatar: "image-2" },
                    { id: "HS003", name: "Trần Minh Hoàng", avatar: "image-3" },
                    { id: "HS004", name: "Phạm Diệu Thảo", avatar: "image-4" },
                    { id: "HS005", name: "Vũ Hải Đăng", avatar: "image-5" },
                    { id: "HS006", name: "Hoàng Gia Bảo", avatar: "image-6" },
                    { id: "HS007", name: "Đặng Thu Hà", avatar: "image-7" }
                ];

                function renderStudents() {
                    const container = document.querySelector('.flex.flex-col.gap-3');
                    students.forEach((student, index) => {
                        const card = document.createElement('div');
                        card.className = "bg-white border border-outline-variant rounded-xl p-4 flex flex-col gap-4 shadow-sm active:bg-surface-container-low transition-colors";
                        card.innerHTML = `
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full overflow-hidden bg-surface-container">
                                    <img src="placeholder" data-alt="Professional studio portrait of a high school student with a friendly expression, captured with soft natural window lighting. The background is a blurred academic setting, creating a professional and focused atmosphere consistent with a clean institutional app design." class="w-full h-full object-cover">
                                </div>
                                <div class="flex-1">
                                    <h3 class="font-body-main font-semibold text-on-surface">${student.name}</h3>
                                    <p class="font-body-sm text-on-surface-variant text-sm">${student.id}</p>
                                </div>
                                <div class="flex items-center">
                                     <span class="material-symbols-outlined text-outline">more_vert</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                <button onclick="setStatus(this, 'present')" class="flex items-center justify-center gap-1 py-2 px-1 border border-outline-variant rounded-lg font-label-uppercase text-[10px] uppercase tracking-wider text-outline hover:bg-green-50 transition-colors">
                                    <span class="material-symbols-outlined text-sm">check_circle</span> Hiện diện
                                </button>
                                <button onclick="setStatus(this, 'absent')" class="flex items-center justify-center gap-1 py-2 px-1 border border-outline-variant rounded-lg font-label-uppercase text-[10px] uppercase tracking-wider text-outline hover:bg-red-50 transition-colors">
                                    <span class="material-symbols-outlined text-sm">cancel</span> Vắng mặt
                                </button>
                                <button onclick="setStatus(this, 'late')" class="flex items-center justify-center gap-1 py-2 px-1 border border-outline-variant rounded-lg font-label-uppercase text-[10px] uppercase tracking-wider text-outline hover:bg-amber-50 transition-colors">
                                    <span class="material-symbols-outlined text-sm">schedule</span> Đi muộn
                                </button>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                }

                window.onload = renderStudents;

                function setStatus(btn, status) {
                    const parent = btn.parentElement;
                    const buttons = parent.querySelectorAll('button');
                    
                    buttons.forEach(b => {
                        b.classList.remove('status-chip-active-present', 'status-chip-active-absent', 'status-chip-active-late', 'text-white');
                        b.classList.add('text-outline');
                    });

                    if (status === 'present') btn.classList.add('status-chip-active-present');
                    if (status === 'absent') btn.classList.add('status-chip-active-absent');
                    if (status === 'late') btn.classList.add('status-chip-active-late');
                    
                    updateCounts();
                }

                function updateCounts() {
                    const present = document.querySelectorAll('.status-chip-active-present').length + document.querySelectorAll('.status-chip-active-late').length;
                    const absent = document.querySelectorAll('.status-chip-active-absent').length;
                    document.getElementById('present-count').innerText = present;
                    document.getElementById('absent-count').innerText = absent;
                }
            </script>
</div>
</main>
<!-- Bottom Action Button Container (Sticky) -->
<div class="fixed bottom-20 left-0 w-full px-container-margin-mobile pointer-events-none mb-4 z-50">

            Hoàn tất điểm danh

</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-secondary-fixed-dim px-4 py-1 hover:bg-surface-variant transition-colors" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-label-uppercase text-label-uppercase mt-1">Học sinh</span>
</a>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="font-label-uppercase text-label-uppercase mt-1">Lớp học</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-secondary-fixed-dim px-4 py-1 hover:bg-surface-variant transition-colors" href="#">
<span class="material-symbols-outlined">badge</span>
<span class="font-label-uppercase text-label-uppercase mt-1">Giáo viên</span>
</a>
</nav>
<!-- Background Subtle Effect -->
<div class="fixed inset-0 -z-10 bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:16px_16px] opacity-30"></div>
<script>
        // Micro-interaction for page entrance
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.bg-white');
            cards.forEach((card, i) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.4s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, i * 50);
            });
        });
    </script>
</body></html>
